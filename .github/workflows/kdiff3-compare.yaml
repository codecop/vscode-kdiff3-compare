name: Test kdiff3-compare

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Test
      run: npm test
